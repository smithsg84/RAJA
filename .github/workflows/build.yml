on: push
name: Build
jobs:
  build_windows:
    strategy:
      matrix:
        shared: 
        - args: 
            BUILD_SHARED_LIBS=On 
            CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=On
        - args: BUILD_SHARED_LIBS=Off


# Notes on Windows CI
# The windows-2025 runner has converted to Visual Studio (VS) 2026.
# cmake added VS 2026 support in cmake v4.2, we had issues with cmake 4.4 related to JSON parsing.
# Testing is currently done on the windows-2022 runner with VS 2022 until the issue can
# be resolved.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          submodules: recursive

## Back off version of cmake with known issue
      - name: Install CMake 3.29
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3  # v4.4.0
        with:
          cmakeVersion: "~3.29.0"

## ====================================
## Config and build action
      - uses: threeal/cmake-action@b684818e3104c3151285e9001e7652b717f11bcd # v1.3.0
        with:
          build-dir: build
          generator: 'Visual Studio 17 2022'     # force VS generator so MSVC is used instead of NMake
          options:
            ENABLE_WARNINGS_AS_ERRORS=Off
            BLT_CXX_STD=c++20
            CMAKE_CXX_STANDARD=20
            CMAKE_BUILD_TYPE=Release
            ${{ matrix.shared.args }}
          run-build: true
          build-args: '--parallel 8'
## ====================================
## Print the contents of the test directory in the build space (debugging)
##    - run: | 
##        dir -r D:\a\RAJA\RAJA\build\test
## ====================================
## Run tests action
      - uses: threeal/ctest-action@8f90c568a3060a3cffb896e241be14bd3f53d526   # v1.1.0
        with:
          build-config: Debug
#
# Building on Windows with CUDA
#
  build_cuda_13_windows:
    name: Windows VS2026 CUDA 13.3
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          submodules: recursive

      - name: Install CUDA 13.3
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          method: network
          sub-packages: '["nvcc", "cudart", "crt", "nvvm", "visual_studio_integration"]'

      - name: Install CMake 4.4.4
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9  # v4.4.4
        with:
          cmakeVersion: "4.4.4"

      - name: Verify toolchain
        shell: pwsh
        run: |
          cmake --version
          nvcc --version
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          dir $env:CUDA_PATH\include\host*
          dir $env:CUDA_PATH\include\crt\*

          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
            throw "CUDA compiler not found"
          }

      - name: Configure RAJA
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_CUDA_ARCHITECTURES=75 `
            -DENABLE_CUDA=On `
            -DCMAKE_CUDA_FLAGS="-Xcompiler=/Zc:preprocessor,/bigobj"

      - name: Build RAJA
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 8
